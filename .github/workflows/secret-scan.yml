name: Secret scan (reusable)

# Reusable secret-scanning workflow for any Jade repo. Call it from a repo with:
#
#   jobs:
#     secrets:
#       uses: jade-pet/.github/.github/workflows/secret-scan.yml@main
#
# Uses the gitleaks CLI via its container image (no org license needed, unlike the
# gitleaks GitHub Action). Fails the job if any secret is detected.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect --source=/repo --redact -v
